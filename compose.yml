
services:

  nginx:
    image: nginx:latest
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stepify
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stepify
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
volumes:
  postgres_data: