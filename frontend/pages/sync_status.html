<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepify - タスク分解</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <div id="app-container">
        <header id="header-viewport"></header>
        <div id="main-layout">
            <aside id="sidebar-viewport"></aside>
            <main id="content-viewport">
                <div class="view-container">
                    <div class="card login-card">
                        <h2 class="card-title">同期状態</h2>
                        <p class="login-description">
                            現在の認証状態と同期の準備状況を確認できます。
                        </p>

                        <div id="sync-status-message" class="auth-status-message" aria-live="polite"></div>

                        <button id="sync-logout-btn" class="btn btn-secondary login-cancel-btn">ログアウト</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { render } from "/js/features/pages/sync_status.js";
        render();
    </script>
</body>
</html>
