<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepify - タスク分解</title>
    <link rel="stylesheet" href="/css/style.css?v=20260822-5">
    <script type="module" src="/js/main.js?v=20260822-5"></script>
</head>
<body>
    <div id="app-container">
        <header id="header-viewport"></header>
        <div id="main-layout">
            <aside id="sidebar-viewport"></aside>
            <main id="content-viewport">
                <div class="view-container task-complete-view">
                    <div class="card task-complete-card">
                        <div class="task-complete-icon">🎉</div>
                        <h2 class="task-complete-title">ナイスステップ！</h2>
                        <p id="task-complete-summary" class="task-complete-summary">小さな完了の積み重ねが大きな前進を生みます。</p>

                        <div class="card task-complete-progress-card">
                            <div class="task-complete-progress-row">
                                <span>親タスクの進捗状況</span>
                                <strong>33%</strong>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar progress-bar-complete"></div>
                            </div>
                        </div>

                        <div class="task-complete-actions">
                            <button id="next-step-btn" class="btn btn-primary task-complete-primary-btn">次のステップへ進む</button>
                            <button id="finish-step-btn" class="btn btn-secondary task-complete-secondary-btn">終了する</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { render } from "/js/features/pages/task_execution_result.js?v=20260822";
        render();
    </script>
</body>
</html>
