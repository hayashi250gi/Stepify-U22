<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepify - タスク分解</title>
    <link rel="stylesheet" href="/css/style.css?v=20260823-1">
    <script type="module" src="/js/main.js?v=20260822-4"></script>
</head>
<body>
    <div id="app-container">
        <header id="header-viewport"></header>
        <div id="main-layout">
            <aside id="sidebar-viewport"></aside>
            <main id="content-viewport">
                <div class="view-container task-suggestion-view">
                    <div class="card task-suggestion-card">
                        <span class="task-suggestion-badge">次に行う推奨アクション</span>

                        <h2 class="task-suggestion-title">机の上のゴミをまとめる</h2>
                        <p class="task-suggestion-description">推定所要時間: <strong>3分</strong></p>

                        <div class="task-suggestion-actions">
                            <button id="start-execution-btn" class="btn btn-primary task-suggestion-start-btn">実行を開始する</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module">
        import { render } from "/js/features/pages/task_suggestion.js?v=20260822-2";
        render();
    </script>
</body>
</html>
