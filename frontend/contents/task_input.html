<div class="view-container mainmenu-view">
    <div class="card mainmenu-card">
        <h2 class="card-title mainmenu-title">何を始めますか？</h2>
        <p class="mainmenu-description">抽象的なタスクを、今すぐできる具体的なステップに分解します。</p>

        <form id="decomp-form">
            <div class="input-group">
                <input type="text" id="task-input" class="input-control" placeholder="例: 部屋の片付け、レポートの作成" required autocomplete="off">
                <input type="text" id="task-detail-input" class="input-control" placeholder="タスクの詳細を入力" autocomplete="off">
            </div>
            <button type="submit" id="decomp-submit-btn" class="btn btn-primary mainmenu-submit-btn">AIで分解する</button>
            <div id="decomp-loading" class="decomp-loading" style="display:none;">
                <span class="spinner"></span>
                <span>AIがタスクを分析中です...</span>
            </div>
        </form>
    </div>

    <div class="mainmenu-history">
        <h3 class="mainmenu-history-title">直近の実行履歴</h3>
        <div class="card mainmenu-history-card">
            <p class="mainmenu-history-text">✓ 読書ノートの作成 (完了: 10分前)</p>
        </div>
    </div>
</div>
