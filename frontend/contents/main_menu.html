<div class="view-container">
    <div class="card" style="max-width: 600px; margin: 40px auto; text-align: center;">
        <h2 class="card-title" style="font-size: 24px;">何を始めますか？</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px;">抽象的なタスクを、今すぐできる具体的なステップに分解します。</p>
        
        <form id="decomp-form">
            <div class="input-group">
                <input type="text" id="task-input" class="input-control" placeholder="例: 部屋の片付け、レポートの作成、プレゼン準備" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">タスクを分解する</button>
        </form>
    </div>

    <div style="max-width: 600px; margin: 0 auto;">
        <h3 style="font-size: 16px; color: var(--text-muted); margin-bottom: 12px;">直近の実行履歴</h3>
        <div class="card" style="padding: 16px;">
            <p style="font-size: 14px;">✓ 読書ノートの作成 (完了: 10分前)</p>
        </div>
    </div>
</div>
