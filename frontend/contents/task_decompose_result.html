<div class="view-container">
    <div class="card result-breakdown-card">
        <div class="result-breakdown-header">
            <div class="result-breakdown-title-area">
                <input id="parent-task-title-input" class="parent-task-title-input" placeholder="タスクタイトルを入力" />
                <textarea id="parent-task-detail-input" class="parent-task-detail-input" placeholder="タスクの詳細（任意）"></textarea>
            </div>
            <button id="edit-deadline-btn" class="btn btn-secondary result-breakdown-settings-btn">⚙️ 締切・優先度設定</button>
        </div>

        <p class="result-breakdown-description">以下のステップが生成されました。タイトル・サブタスクは画面内で直接編集できます。ドラッグで順番を並べ替えてください。</p>

        <div id="steps-list-container" class="result-breakdown-list"></div>

        <div class="result-breakdown-actions">
            <button id="retry-breakdown-btn" class="btn btn-secondary result-breakdown-retry-btn">やり直す</button>
            <button id="to-proposal-btn" class="btn btn-primary result-breakdown-confirm-btn">この内容で確定して進む</button>
        </div>
    </div>
</div>
