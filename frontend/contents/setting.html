<div class="view-container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 class="card-title">アプリ設定</h2>
        
        <div class="input-group">
            <label for="timer-setting">デフォルトのタイマー時間 (分)</label>
            <input type="number" id="timer-setting" class="input-control" value="15">
        </div>

        <div class="input-group">
            <label for="ai-model-setting">使用AIモデル（拡張性要件）</label>
            <select id="ai-model-setting" class="input-control">
                <option value="gemini-1.5-flash">Gemini 1.5 Flash (推奨: 高速)</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro (高度な分解)</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="alert('設定を保存しました（フロントエンド擬似処理）'); loadView('main-menu');">設定を保存</button>
    </div>
</div>
