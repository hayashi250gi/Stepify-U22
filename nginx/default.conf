server {
    listen 80;
    server_name stepify-u22.site www.stepify-u22.site localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stepify-u22.site www.stepify-u22.site localhost;

    ssl_certificate /etc/letsencrypt/live/stepify-u22.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stepify-u22.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/favicon.png;
        default_type image/png;
    }

    # 静的ファイルはそのまま配信
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
    }

    # APIはバックエンドへ
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA用: 全アクセスを index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }
}
