server {
    listen 80;
    root /usr/share/nginx/html;

    # 静的ファイルはそのまま配信
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
    }

    # APIはバックエンドへ
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # SPA用: 全アクセスを index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }
}
